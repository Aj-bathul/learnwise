{% extends "base.html" %}
{% block title %}Register — LearnWise{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3">Create your account</h3>

        <form id="registerForm" method="POST">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="full_name" id="full_name" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" id="email" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-control">
            <div class="form-text">At least 8 characters.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm password</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Interests (optional)</label>
            <input type="text" name="interests" id="interests" class="form-control" placeholder="e.g. web development, data science">
            <div class="form-text">Used to personalise course recommendations.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>

        <p class="mt-3 mb-0 text-center">
          Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
