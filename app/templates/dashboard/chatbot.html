{% extends "base.html" %}
{% block title %}Learning Assistant — LearnWise{% endblock %}
{% block content %}
<h2 class="display-heading mb-1">Learning assistant</h2>
<p class="text-muted mb-4">Ask about anything from a lesson or quiz topic.</p>

<div class="card">
  <div class="card-body">
    <div id="chat-log" class="mb-3" style="min-height: 220px; max-height: 420px; overflow-y: auto;">
      <p class="text-muted small">No messages yet — ask a question below to get started.</p>
    </div>
    <form id="chat-form" class="d-flex gap-2">
      <input type="text" id="chat-input" class="form-control" placeholder="e.g. Explain recursion in simple terms" required>
      <button type="submit" class="btn btn-primary" id="chat-submit">Ask</button>
    </form>
  </div>
</div>

<script>
const form = document.getElementById('chat-form');
const log = document.getElementById('chat-log');
const submitBtn = document.getElementById('chat-submit');
let firstMessage = true;

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const question = input.value.trim();
  if (!question) return;

  if (firstMessage) { log.innerHTML = ''; firstMessage = false; }

  log.innerHTML += `<div class="mb-2"><strong>You:</strong> ${question}</div>`;
  input.value = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Thinking...';
  log.scrollTop = log.scrollHeight;

  try {
    const resp = await fetch("{{ url_for('chatbot.ask') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const data = await resp.json();
    log.innerHTML += `<div class="mb-3" style="color: var(--teal-dark);"><strong>Assistant:</strong> ${data.answer || data.error}</div>`;
  } catch (err) {
    log.innerHTML += `<div class="mb-3 text-danger"><strong>Assistant:</strong> Something went wrong reaching the server.</div>`;
  }

  submitBtn.disabled = false;
  submitBtn.textContent = 'Ask';
  log.scrollTop = log.scrollHeight;
});
</script>
{% endblock %}
