{% extends "base.html" %}
{% block title %}Manage Users — Admin{% endblock %}
{% block content %}
<h2 class="mb-4">Users</h2>
<table class="table table-striped">
  <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead>
  <tbody>
    {% for u in users %}
      <tr>
        <td>{{ u.full_name }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.role.name }}</td>
        <td>{{ u.created_at.strftime('%Y-%m-%d') }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
