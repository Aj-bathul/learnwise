{% extends "base.html" %}
{% block title %}Add Quiz — Admin{% endblock %}
{% block content %}
<h2 class="mb-4">Add Quiz to {{ course.title }}</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Quiz title</label>
    <input type="text" name="title" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-primary">Create quiz</button>
  <a href="{{ url_for('admin.course_edit', course_id=course.id) }}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
